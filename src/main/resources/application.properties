spring.application.name=board-api
server.port=3001

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:board}

spring.datasource.username=${DB_USERNAME:board}
spring.datasource.password=${DB_PASSWORD:board1234}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
board.view-count.sync-interval=1m

#flyway
spring.flyway.enabled=true

#jpa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#임시
jwt.secret=${JWT_SECRET:jwt-practice-secret-key-please-hire-me-2026}
jwt.access-token-expiration=3600000
